_base_: ../_base_/default.yaml

model:
  reasoning_effort: medium

train:
  num_epochs: 3
  batch_size: 4
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 2
  merge_batch_size: 2
  analyst_workers: 2

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  lr_scheduler: cosine
  skill_update_mode: patch
  use_slow_update: true
  slow_update_samples: 6
  use_meta_skill: true

evaluation:
  use_gate: true
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

env:
  name: rubrictext
  skill_init: ""
  split_mode: split_dir
  split_dir: ""
  workers: 1
  max_completion_tokens: 4096
  limit: 0
